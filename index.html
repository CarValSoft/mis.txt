<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Editor TXT protegido</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;
    font-family:Arial;
}

textarea{
    width:100%;
    height:70vh;
    background:#111;
    color:#fff;
    border:none;
    outline:none;
    resize:none;
    padding:15px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:10px 25px;
}

#status{
    margin-top:15px;
}

</style>

</head>

<body>

<h1>Editor TXT protegido</h1>

<textarea id="editor">
Cargando...
</textarea>

<br>

<button onclick="guardar()">
Guardar
</button>

<div id="status"></div>

<script>

const PASSWORD = "123";

async function cargar(){

    try{

        const r = await fetch(
            "/api?action=get&password=" + PASSWORD
        );

        const data = await r.json();

        console.log(data);

        if(!data.ok){

            document.getElementById("status").innerText =
            data.error;

            return;

        }

        document.getElementById("editor").value =
        data.content;

        document.getElementById("status").innerText =
        "Archivo cargado.";

    }catch(err){

        document.getElementById("status").innerText =
        err.toString();

    }

}

async function guardar(){

    try{

        const content =
        document.getElementById("editor").value;

        const r = await fetch("/api", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                password:PASSWORD,
                content:content

            })

        });

        const data = await r.json();

        document.getElementById("status").innerText =
        data.message || data.error;

    }catch(err){

        document.getElementById("status").innerText =
        err.toString();

    }

}

cargar();

</script>

</body>
</html>
