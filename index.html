<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TXT</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;
    font-family:Arial;
}

#loginBox,
#editorBox{
    max-width:900px;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    margin-top:10px;
    font-size:16px;
    background:#111;
    color:#fff;
    border:none;
    outline:none;
}

textarea{
    width:100%;
    height:70vh;
    background:#111;
    color:#fff;
    border:none;
    outline:none;
    resize:none;
    padding:15px;
    box-sizing:border-box;
    font-size:16px;
    margin-top:10px;
}

button{
    margin-top:10px;
    padding:10px 25px;
    cursor:pointer;
}

#status{
    margin-top:10px;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div id="loginBox">

    <input
    type="password"
    id="password"
    placeholder="Contraseña"
    autofocus>

</div>

<div id="editorBox" class="hidden">

    <textarea id="editor"></textarea>

    <br>

    <button onclick="guardar()">
    Guardar cambios
    </button>

</div>

<div id="status">
Listo.
</div>

<script>

let PASSWORD = "";

document
.getElementById("password")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        entrar();

    }

});

async function entrar(){

    PASSWORD =
    document.getElementById("password").value;

    if(!PASSWORD){

        document.getElementById("status").innerText =
        "Ingresa contraseña.";

        return;

    }

    try{

        const r = await fetch(
            "/api?action=get&password=" +
            encodeURIComponent(PASSWORD)
        );

        const data = await r.json();

        if(!data.ok){

            document.getElementById("status").innerText =
            data.error;

            return;

        }

        document.getElementById("editor").value =
        data.content;

        document.getElementById("loginBox")
        .classList.add("hidden");

        document.getElementById("editorBox")
        .classList.remove("hidden");

        document.getElementById("status").innerText =
        "Archivo cargado.";

    }catch(err){

        document.getElementById("status").innerText =
        err.toString();

    }

}

async function guardar(){

    try{

        const content =
        document.getElementById("editor").value;

        const r = await fetch("/api", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                password:PASSWORD,
                content:content

            })

        });

        const data = await r.json();

        document.getElementById("status").innerText =
        data.message || data.error;

    }catch(err){

        document.getElementById("status").innerText =
        err.toString();

    }

}

</script>

</body>
</html>
