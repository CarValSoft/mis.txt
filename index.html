<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TXT</title>

<style>

    #saveBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: grayscale(1);
}

estado-tab {padding:2px 4px;}

html,
body{
    margin:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

/* LOGIN */

#loginWrap{
    width:155px;
    margin:14px auto 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    z-index:20;

    border-width: 1px;
    border-style: solid;
    border-color: rgba(52, 115, 25, 0.5);
}

#password{
    width:95px;
    box-sizing:border-box;
    background:#111;
    color:#fff;
    font-size:15px;
    border:none;
    outline:none;
    padding:5px;
    
}

#loginStatus{

    color:#aaa;
    font-size:14px;
    white-space:nowrap;

}

#loginStatus a{

    color:#aaa;
    text-decoration:none;
    cursor:pointer;

}

    #loginStatus a:hover{
    text-decoration:underline;

}        

/* EDITOR */

#editor{
    width:100vw;
    height:100vh;
    margin:0;
    padding:10px 10px 80px 10px;
    border:none;
    outline:none;
    resize:none;
    background:#111;
    color:#fff;
    box-sizing:border-box;
    font-size:16px;
    font-family:Consolas, monospace;
    
    tab-size: 78px;
    -moz-tab-size: 78px; /* Soporte para Firefox */

.estado-info {
    font-family: sans-serif;
    font-size: 0.8em;
    margin-bottom: 5px;
    color: #666;
  }
    
}

/* SAVE BAR */

#saveWrap{

    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:12px;
    
    border-width: 1px;
    border-style: solid;
    border-color: rgba(52, 115, 25, 0.5);
    
    width:200px;

    background-color: rgba(56, 68, 87, 0.8);

    display:flex;
    align-items:center;
    gap:14px;

    opacity:0;

    transition:opacity .18s ease;

    z-index:50;

    border-radius: 15px;

}

#saveWrap:hover{
    opacity:1;
}

#saveWrap.show{
    opacity:1;
    color:#05ff2f;
}

#saveBtn{

    padding:4px 6px;
    border:none;
    cursor:pointer;

    border-radius: 15px;

}

#saveStatus{

    color:#aaa;
    font-size:14px;
    white-space:nowrap;

}

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginWrap">

    <input
    type="password"
    id="password"
    placeholder="Contraseña"
    autofocus>

    <div id="loginStatus">

        <a onclick="entrar()">
        Listo.
        </a>

    </div>

</div>

<!-- EDITOR -->

<textarea
id="editor"
class="hidden"></textarea>

<!-- SAVE -->

<div id="saveWrap" class="hidden">

    <button id="saveBtn" onclick="guardar()">Guardar</button>

    <div id="saveStatus"></div>

    <div id="indicadorTab" class="estado-tab" style="color: green;">↦</div>
            
</div>

</div>

<script>
let PASSWORD = "";
let sangriaActiva = true;

const editor = document.getElementById("editor");
const loginStatus = document.getElementById("loginStatus");
const saveWrap = document.getElementById("saveWrap");
const saveStatus = document.getElementById("saveStatus");
const saveBtn = document.getElementById("saveBtn");
const indicador = document.getElementById("indicadorTab");
const passwordInput = document.getElementById("password");

/* AUXILIARES */
function flashSaveBar() {
    saveWrap.classList.add("show");
    saveWrap.style.opacity = "1";
    clearTimeout(window.__saveTimer);
    window.__saveTimer = setTimeout(() => {
        saveWrap.classList.remove("show");
        if (!saveWrap.matches(':hover')) {
            saveWrap.style.opacity = "0";
        }
    }, 1000);
}

/* LOGIN */
async function entrar() {
    PASSWORD = passwordInput.value;
    if (!PASSWORD) {
        loginStatus.innerHTML = "Error.";
        return;
    }
    try {
        const r = await fetch("/api?action=get&password=" + encodeURIComponent(PASSWORD));
        const data = await r.json();
        if (!data.ok) {
            loginStatus.innerHTML = "Error.";
            return;
        }
        editor.value = data.content;
        editor.classList.remove("hidden");
        saveWrap.classList.remove("hidden"); // Mostrar barra al entrar
        document.getElementById("loginWrap").classList.add("hidden");
        saveStatus.innerText = "Cargado.";
        flashSaveBar();
    } catch (err) {
        loginStatus.innerHTML = "Error de conexión.";
        console.error(err);
    }
}

/* GUARDAR */
async function guardar() {
    saveBtn.disabled = true;
    saveStatus.innerText = "Guardando...";
    saveWrap.classList.add("show");
    saveWrap.style.opacity = "1";

    try {
        const r = await fetch("/api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                password: PASSWORD,
                content: editor.value
            })
        });
        const data = await r.json();
        saveStatus.innerText = data.message || data.error || "Guardado.";
    } catch (err) {
        saveStatus.innerText = "Error.";
    } finally {
        saveBtn.disabled = false;
        flashSaveBar();
    }
}

/* EVENTOS */
passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") entrar();
});

editor.addEventListener('keydown', function(e) {
    // Ctrl + S
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (!saveBtn.disabled) guardar();
        return;
    }

    // Esc (Sangría)
    if (e.key === 'Escape') {
        e.preventDefault();
        sangriaActiva = !sangriaActiva;
        indicador.style.color = sangriaActiva ? "green" : "red";
        saveStatus.innerText = sangriaActiva ? "Sangría: ON" : "Sangría: OFF";
        flashSaveBar();
        return;
    }

    // Tab
    if (e.key === 'Tab' && sangriaActiva) {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 1;
    }
});

document.addEventListener("mousemove", e => {
    if (window.innerHeight - e.clientY < 70) {
        saveWrap.style.opacity = "1";
    } else if (!saveWrap.classList.contains("show")) {
        saveWrap.style.opacity = "0";
    }
});
</script>


</body>
</html>
