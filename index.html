<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TXT</title>

<style>

html,
body{
    margin:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

/* LOGIN */

#loginWrap{
    width:350px;
    margin:14px auto 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    z-index:20;
}

#password{
    width:120px;
    padding:10px;
    box-sizing:border-box;
    background:#111;
    color:#fff;
    border:none;
    outline:none;
    font-size:15px;
}

#loginStatus{

    color:#aaa;
    font-size:14px;
    white-space:nowrap;

}

#loginStatus a{

    color:#aaa;
    text-decoration:none;
    cursor:pointer;

}

/* EDITOR */

#editor{
    width:100vw;
    height:100vh;
    margin:0;
    padding:0;
    border:none;
    outline:none;
    resize:none;
    background:#111;
    color:#fff;
    box-sizing:border-box;
    font-size:16px;
    font-family:Consolas, monospace;
}

/* SAVE BAR */

#saveWrap{

    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:12px;

    width:450px;

    display:flex;
    align-items:center;
    gap:14px;

    opacity:0;

    transition:opacity .18s ease;

    z-index:50;

}

#saveWrap:hover{
    opacity:1;
}

#saveWrap.show{
    opacity:1;
}

#saveBtn{

    padding:10px 22px;
    border:none;
    cursor:pointer;

}

#saveStatus{

    color:#aaa;
    font-size:14px;
    white-space:nowrap;

}

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginWrap">

    <input
    type="password"
    id="password"
    placeholder="Contraseña"
    autofocus>

    <div id="loginStatus">

        <a onclick="entrar()">
        Listo.
        </a>

    </div>

</div>

<!-- EDITOR -->

<textarea
id="editor"
class="hidden"></textarea>

<!-- SAVE -->

<div id="saveWrap">

    <button
    id="saveBtn"
    onclick="guardar()">

    Guardar cambios

    </button>

    <div id="saveStatus"></div>

</div>

<script>

let PASSWORD = "";

const editor =
document.getElementById("editor");

const loginStatus =
document.getElementById("loginStatus");

const saveWrap =
document.getElementById("saveWrap");

const saveStatus =
document.getElementById("saveStatus");

/* ENTER */

document
.getElementById("password")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        entrar();

    }

});

/* SAVE BAR VISIBILITY */

document.addEventListener("mousemove", e => {

    if(
        window.innerHeight - e.clientY < 70
    ){

        saveWrap.style.opacity = "1";

    }else{

        if(!saveWrap.classList.contains("show")){

            saveWrap.style.opacity = "0";

        }

    }

});

/* TEMP MESSAGE */

function flashSaveBar(){

    saveWrap.classList.add("show");

    clearTimeout(window.__saveTimer);

    window.__saveTimer =
    setTimeout(()=>{

        saveWrap.classList.remove("show");

    },2000);

}

/* LOGIN */

async function entrar(){

    PASSWORD =
    document.getElementById("password").value;

    if(!PASSWORD){

        loginStatus.innerHTML =
        "Ingresa contraseña.";

        return;

    }

    try{

        const r = await fetch(

            "/api?action=get&password=" +

            encodeURIComponent(PASSWORD)

        );

        const data = await r.json();

        if(!data.ok){

            loginStatus.innerHTML =
            "Contraseña incorrecta.";

            return;

        }

        editor.value =
        data.content;

        editor.classList.remove("hidden");

        document
        .getElementById("loginWrap")
        .classList.add("hidden");

        saveStatus.innerText =
        "Archivo cargado.";

        flashSaveBar();

    }catch(err){

        loginStatus.innerHTML =
        err.toString();

    }

}

/* SAVE */

async function guardar(){

    try{

        const r = await fetch("/api", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                password:PASSWORD,
                content:editor.value

            })

        });

        const data = await r.json();

        saveStatus.innerText =

        data.message ||

        data.error ||

        "Guardado correctamente.";

        flashSaveBar();

    }catch(err){

        saveStatus.innerText =
        err.toString();

        flashSaveBar();

    }

}

</script>

</body>
</html>
